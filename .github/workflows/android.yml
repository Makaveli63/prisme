name: APK Android

on:
  push:
    branches: [main, launcher]
    paths:
      - "android/**"
      - "index.html"
      - "icon*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk prisme-home.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prisme-home-apk
          path: prisme-home.apk
      # Version téléchargeable directement depuis la tablette : une pré-version « apk-<branche> » remplacée à chaque build.
      - name: Publier la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" prisme-home.apk --prerelease --target "$GITHUB_SHA" \
            --title "Prisme Home (APK, branche ${{ github.ref_name }})" \
            --notes "APK compilé depuis ${GITHUB_SHA::7}. Sur la tablette : télécharger prisme-home.apk, autoriser l'installation depuis le navigateur, installer, puis appuyer sur Accueil et choisir Prisme Home."
