<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prisme Home</title>
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prisme Home">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Direction : vue Maison façon Apple, matière Liquid Glass (même palette que Prisme).
   Mise en page : colonne principale (scènes, pièces, tuiles) + colonne latérale (imprimante, lecture) + dock d'applications. */
:root {
  --bg: #eef1f7; --text: #0d1220; --muted: #6b7286; --tint: #2f7bf5; --warm: #ffb340;
  --glass: rgba(255, 255, 255, .26); --glass-strong: rgba(255, 255, 255, .8);
  --rim: rgba(255, 255, 255, .95); --rim-2: rgba(255, 255, 255, .5); --glow: rgba(255, 255, 255, .45);
  --on-bg: rgba(255, 255, 255, .94); --on-text: #141a2b; --on-muted: #6a7186;
  --track: rgba(110, 120, 150, .22); --shadow: 0 12px 32px rgba(20, 30, 70, .14), 0 2px 8px rgba(20, 30, 70, .08);
  --b1: #9ec5ff; --b2: #ffc6e0; --b3: #c9b8ff; --b4: #ffe1b0;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d13; --text: #f1f3f8; --muted: #8c93a5; --tint: #4b93ff;
    --glass: rgba(255, 255, 255, .07); --glass-strong: rgba(34, 38, 52, .86);
    --rim: rgba(255, 255, 255, .42); --rim-2: rgba(255, 255, 255, .14); --glow: rgba(255, 255, 255, .06);
    --track: rgba(255, 255, 255, .16); --shadow: 0 12px 32px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
    --b1: #1d3a7a; --b2: #5a1f4a; --b3: #33236e; --b4: #5a3a14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d13; --text: #f1f3f8; --muted: #8c93a5; --tint: #4b93ff;
  --glass: rgba(255, 255, 255, .07); --glass-strong: rgba(34, 38, 52, .86);
  --rim: rgba(255, 255, 255, .42); --rim-2: rgba(255, 255, 255, .14); --glow: rgba(255, 255, 255, .06);
  --track: rgba(255, 255, 255, .16); --shadow: 0 12px 32px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  --b1: #1d3a7a; --b2: #5a1f4a; --b3: #33236e; --b4: #5a3a14;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(12px, min(2vh, 1.4vw), 22px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.35 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
svg { width: 1.5rem; height: 1.5rem; flex: none; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }

/* Fond animé */
.blobs { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; animation: drift 28s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { width: 55vmax; height: 55vmax; background: var(--b1); left: -18vmax; top: 10vh; }
.blobs i:nth-child(2) { width: 45vmax; height: 45vmax; background: var(--b2); right: -14vmax; top: 6vh; animation-duration: 34s; }
.blobs i:nth-child(3) { width: 50vmax; height: 50vmax; background: var(--b3); left: 18vw; bottom: -26vmax; animation-duration: 40s; }
.blobs i:nth-child(4) { width: 28vmax; height: 28vmax; background: var(--b4); right: 24vw; bottom: 6vh; animation-duration: 31s; opacity: .5; }
@keyframes drift { to { transform: translate(6vw, 5vh) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .blobs i { animation: none; } }

/* Matière verre */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(200%); backdrop-filter: blur(14px) saturate(200%);
  box-shadow: var(--shadow), inset 1.5px 1.5px 1px -1px var(--rim), inset -1.5px -1.5px 1px -1px var(--rim-2), inset 0 0 16px var(--glow);
}

/* Mise en page */
.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 22rem; grid-template-rows: minmax(0, 1fr) auto; gap: 1rem 1.5rem;
  padding: max(1.4rem, env(safe-area-inset-top)) max(1.6rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1.6rem, env(safe-area-inset-left)); }
.main { min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 1.1rem; padding-bottom: .5rem; }
.main::-webkit-scrollbar, .side::-webkit-scrollbar { display: none; }
.main > *, .side > * { flex: none; }
.side { min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 1rem; padding-top: .3rem; }
.dock { grid-column: 1 / -1; justify-self: center; display: flex; gap: 1.1rem; padding: .7rem 1.2rem; border-radius: 2rem; }

/* En-tête */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.date { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--muted); }
.clock { margin: 0; font-size: 4.6rem; line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hello { margin: .35rem 0 0; font-size: 1.15rem; font-weight: 600; }
.status { margin: .15rem 0 0; color: var(--muted); font-size: .95rem; }
.tools { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem .95rem; border-radius: 99px; font-weight: 600; font-size: .95rem; }
.chip svg { width: 1.25rem; height: 1.25rem; }
.round { width: 2.9rem; height: 2.9rem; border-radius: 50%; display: grid; place-items: center; }
.round svg { width: 1.3rem; height: 1.3rem; }

/* Scènes et pièces */
.scenes, .rooms { display: flex; gap: .6rem; overflow-x: auto; scrollbar-width: none; padding: .2rem .1rem .5rem; margin: 0 -.1rem; }
.scenes::-webkit-scrollbar, .rooms::-webkit-scrollbar { display: none; }
.scene { display: inline-flex; align-items: center; gap: .6rem; padding: .7rem 1.1rem; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.scene svg { width: 1.3rem; height: 1.3rem; color: var(--tint); }
.scene.active { background: var(--on-bg); color: var(--on-text); }
.rooms { gap: 1.4rem; padding-bottom: 0; }
.room { font-size: 1.2rem; font-weight: 700; color: var(--muted); padding: .2rem 0; white-space: nowrap; }
.room[aria-selected="true"] { color: var(--text); }

/* Tuiles */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .9rem; align-content: start; }
.tile { min-height: 8.6rem; border-radius: 1.7rem; padding: 1.05rem; display: flex; flex-direction: column; justify-content: space-between; text-align: left;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: background .25s, color .25s, transform .12s; }
.tile:active { transform: scale(.97); }
.tile .ico { width: 2.7rem; height: 2.7rem; border-radius: 50%; display: grid; place-items: center; background: var(--track); transition: background .25s, color .25s; }
.tile .ico svg { width: 1.45rem; height: 1.45rem; }
.tile .name { display: block; font-weight: 650; font-size: 1.02rem; line-height: 1.2; }
.tile .state { display: block; margin-top: .15rem; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.on { background: var(--on-bg); color: var(--on-text); }
.tile.on .state { color: var(--on-muted); }
.tile.on .ico { background: rgba(255, 179, 64, .28); color: #c27400; }
.tile.on.cool .ico, .tile.on.lockd .ico { background: rgba(47, 123, 245, .16); color: #1f64d6; }
.hint { margin: 0; font-size: .85rem; color: var(--muted); }

/* Cartes latérales */
.card { border-radius: 1.8rem; padding: 1.15rem; }
.card h2 { margin: 0 0 .8rem; font-size: .85rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
.card h2 svg { width: 1.1rem; height: 1.1rem; }
.printer { display: flex; align-items: center; gap: 1rem; }
.ring { position: relative; width: 6rem; height: 6rem; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--track); }
.ring .fg { stroke: #34c759; stroke-linecap: round; stroke-dasharray: 251.3; transition: stroke-dashoffset .8s; }
.ring.paused .fg { stroke: var(--warm); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.pinfo { min-width: 0; }
.pinfo strong { display: block; font-size: 1.05rem; }
.pinfo span { display: block; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: .6rem; margin-top: .9rem; flex-wrap: wrap; }
.btn { padding: .6rem 1rem; border-radius: 99px; font-weight: 650; background: var(--track); }
.btn.primary { background: var(--tint); color: #fff; }
.media { display: flex; gap: .9rem; align-items: center; }
.poster { width: 4.6rem; height: 4.6rem; border-radius: 1rem; flex: none; background: linear-gradient(145deg, #e5a00d, #b0561d 60%, #5a2a1a); display: grid; place-items: center; color: rgba(255, 255, 255, .9); }
.poster svg { width: 2rem; height: 2rem; }
.minfo { min-width: 0; }
.minfo strong { display: block; font-size: 1.02rem; line-height: 1.2; }
.minfo span { color: var(--muted); font-size: .9rem; }
.bar { height: .4rem; border-radius: 9px; background: var(--track); margin: .9rem 0 .2rem; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--text); border-radius: 9px; transition: width .8s linear; }
.transport { display: flex; justify-content: center; gap: 1.4rem; align-items: center; }
.transport button { width: 2.8rem; height: 2.8rem; display: grid; place-items: center; border-radius: 50%; }
.transport .play { width: 3.4rem; height: 3.4rem; background: var(--text); color: var(--bg); }

/* Dock */
.app-btn { display: flex; flex-direction: column; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 600; width: 4.6rem; }
.app-ico { width: 3.5rem; height: 3.5rem; border-radius: 1.05rem; display: grid; place-items: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 4px 12px rgba(0, 0, 0, .18); }
.app-ico svg { width: 1.8rem; height: 1.8rem; }
.app-btn:active .app-ico { transform: scale(.92); }

/* Fiche de réglage */
dialog { border: 0; padding: 1.4rem; border-radius: 2rem; width: min(26rem, calc(100vw - 2rem)); color: var(--text); background: var(--glass-strong);
  -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%); box-shadow: 0 30px 80px rgba(0, 0, 0, .35), inset 0 1px 0 var(--rim); }
dialog::backdrop { background: rgba(10, 14, 28, .35); }
dialog h3 { margin: 0; font-size: 1.15rem; }
dialog .sub { margin: .15rem 0 0; color: var(--muted); font-size: .9rem; }
dialog .big { margin: 1rem 0 .6rem; font-size: 3.2rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
dialog input[type=range] { width: 100%; height: 2.6rem; accent-color: var(--tint); }
dialog .row { justify-content: space-between; }

/* Veille */
.ambient { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; background: #06070c; color: #fff; }
.amb-blobs { position: absolute; inset: 0; pointer-events: none; }
.amb-blobs i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 44s ease-in-out infinite alternate; }
.amb-blobs i:nth-child(1) { width: 60vmax; height: 60vmax; background: #1d3a7a; left: -20vmax; top: -12vmax; }
.amb-blobs i:nth-child(2) { width: 50vmax; height: 50vmax; background: #5a1f4a; right: -18vmax; bottom: -18vmax; animation-duration: 56s; }
.amb-blobs i:nth-child(3) { width: 34vmax; height: 34vmax; background: #33236e; left: 38vw; top: 30vh; animation-duration: 48s; opacity: .4; }
.amb-stage { position: relative; display: grid; place-items: center; text-align: center; gap: 1.3rem; animation: float 90s ease-in-out infinite alternate; }
@keyframes float { from { transform: translate(-1.2vmin, -.8vmin); } to { transform: translate(1.2vmin, .8vmin); } }
.amb-time { display: flex; align-items: center; font-size: min(36vh, 26vw); line-height: .9; font-weight: 200; letter-spacing: -.045em; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff 25%, rgba(255, 255, 255, .45)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.amb-time .colon { padding-bottom: .08em; animation: blink 2s steps(1) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.amb-date { font-size: 1.8rem; font-weight: 500; color: rgba(255, 255, 255, .82); }
.amb-info { font-size: 1.1rem; color: rgba(255, 255, 255, .55); font-variant-numeric: tabular-nums; min-height: 1.4em; }
.amb-analog { display: none; width: min(66vh, 66vw); aspect-ratio: 1; }
.amb-analog svg { width: 100%; height: 100%; overflow: visible; }
.ambient[data-style="analog"] .amb-digital { display: none; }
.ambient[data-style="analog"] .amb-analog { display: block; }
.disc { fill: rgba(255, 255, 255, .05); stroke: rgba(255, 255, 255, .3); stroke-width: 1.5; }
.tick { stroke: rgba(255, 255, 255, .4); stroke-width: 1.2; stroke-linecap: round; }
.tick.big { stroke: #fff; stroke-width: 3; }
.hand { stroke-linecap: round; transform-origin: 160px 160px; }
.hand.h { stroke: #fff; stroke-width: 7; }
.hand.m { stroke: #fff; stroke-width: 4.5; }
.hand.s { stroke: #ff9f43; stroke-width: 2; }
.hub { fill: #ff9f43; }
.amb-ctrl { position: absolute; bottom: max(1.4rem, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 1rem; font-size: .9rem; color: rgba(255, 255, 255, .55); white-space: nowrap; }
.amb-ctrl button { padding: .55rem 1.1rem; border-radius: 99px; font-weight: 600; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); color: #fff; }
.ambient.night { filter: brightness(.5) sepia(.6) saturate(1.7) hue-rotate(-14deg); }
@media (prefers-reduced-motion: reduce) { .amb-stage, .amb-blobs i, .amb-time .colon { animation: none; } }

.toast { position: fixed; left: 50%; bottom: 7.4rem; transform: translate(-50%, 1rem); z-index: 30; padding: .75rem 1.2rem; border-radius: 99px; font-weight: 600;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Portrait : une seule colonne qui défile */
@media (max-aspect-ratio: 1/1) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; align-content: start; }
  .main, .side { overflow: visible; }
  .dock { position: sticky; bottom: .8rem; }
  .clock { font-size: 3.6rem; }
}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="app">
  <section class="main" aria-label="Maison">
    <header class="head">
      <div>
        <p class="date" id="date"></p>
        <h1 class="clock" id="clock">--:--</h1>
        <p class="hello" id="hello"></p>
        <p class="status" id="status"></p>
      </div>
      <div class="tools">
        <span class="chip glass" id="weather"></span>
        <button class="round glass" id="btn-theme" aria-label="Changer le thème"></button>
        <button class="round glass" id="btn-full" aria-label="Plein écran"></button>
        <button class="round glass" id="btn-sleep" aria-label="Mise en veille"></button>
      </div>
    </header>
    <div class="scenes" id="scenes" role="group" aria-label="Scènes"></div>
    <nav class="rooms" id="rooms" role="tablist" aria-label="Pièces"></nav>
    <div class="grid" id="grid"></div>
    <p class="hint">Touche une tuile pour l'allumer ou l'éteindre. Appui long pour régler.</p>
  </section>

  <aside class="side" aria-label="Activité">
    <div class="card glass" id="printer-card">
      <h2 id="printer-title"></h2>
      <div class="printer">
        <div class="ring" id="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" id="ring-fg" cx="50" cy="50" r="40"/></svg><b id="ring-val">0 %</b></div>
        <div class="pinfo"><strong id="p-job"></strong><span id="p-left"></span><span id="p-temps"></span></div>
      </div>
      <div class="row"><button class="btn primary" id="p-toggle"></button></div>
    </div>
    <div class="card glass" id="media-card">
      <h2 id="media-title"></h2>
      <div class="media">
        <div class="poster" id="poster"></div>
        <div class="minfo"><strong id="m-title"></strong><span id="m-sub"></span></div>
      </div>
      <div class="bar"><i id="m-bar"></i></div>
      <div class="transport">
        <button id="m-prev" aria-label="Précédent"></button>
        <button class="play" id="m-play" aria-label="Lecture ou pause"></button>
        <button id="m-next" aria-label="Suivant"></button>
      </div>
    </div>
  </aside>

  <nav class="dock glass" id="dock" aria-label="Applications"></nav>
</div>

<dialog id="sheet" aria-labelledby="sheet-name">
  <h3 id="sheet-name"></h3>
  <p class="sub" id="sheet-room"></p>
  <div class="big" id="sheet-val"></div>
  <input type="range" id="sheet-range" aria-label="Réglage">
  <div class="row"><button class="btn" id="sheet-toggle"></button><button class="btn primary" id="sheet-close">Terminé</button></div>
</dialog>

<div class="ambient" id="ambient" data-style="digital" hidden>
  <div class="amb-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="amb-stage">
    <div class="amb-digital"><div class="amb-time" aria-hidden="true"><span id="ah">--</span><span class="colon">:</span><span id="am">--</span></div></div>
    <div class="amb-analog" aria-hidden="true">
      <svg viewBox="0 0 320 320"><circle class="disc" cx="160" cy="160" r="156"/><g id="ticks"></g>
        <line class="hand h" id="hand-h" x1="160" y1="172" x2="160" y2="92"/>
        <line class="hand m" id="hand-m" x1="160" y1="176" x2="160" y2="56"/>
        <line class="hand s" id="hand-s" x1="160" y1="184" x2="160" y2="42"/>
        <circle class="hub" cx="160" cy="160" r="7"/></svg>
    </div>
    <div class="amb-date" id="a-date"></div>
    <div class="amb-info" id="a-info"></div>
  </div>
  <div class="amb-ctrl"><button id="amb-style"></button><span>Touche l'écran pour quitter</span></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Configuration (exemples à remplacer par tes vraies données) ---------- */
const USER = "Mathieu";
const WEATHER = { temp: 15, label: "Nuageux" };
const ROOMS = ["Tout", "Salon", "Bureau", "Atelier", "Chambre"];
const IDLE_MS = 120000;

const DEVICES = [
  { id: "l1", name: "Lumière salon",   room: "Salon",   type: "light",  on: true,  level: 70 },
  { id: "th", name: "Thermostat",      room: "Salon",   type: "thermo", on: true,  target: 19, current: 18.5 },
  { id: "b1", name: "Volets salon",    room: "Salon",   type: "blind",  level: 100 },
  { id: "tv", name: "TV salon",        room: "Salon",   type: "tv",     on: false },
  { id: "lk", name: "Porte d'entrée",  room: "Salon",   type: "lock",   on: true },
  { id: "l2", name: "Lampe bureau",    room: "Bureau",  type: "light",  on: false, level: 100 },
  { id: "l3", name: "Ruban LED",       room: "Bureau",  type: "light",  on: true,  level: 40 },
  { id: "pc", name: "Prise du PC",     room: "Bureau",  type: "plug",   on: true },
  { id: "pi", name: "Prise imprimante",room: "Atelier", type: "plug",   on: true },
  { id: "l4", name: "Lumière chambre", room: "Chambre", type: "light",  on: false, level: 60 },
  { id: "b2", name: "Volets chambre",  room: "Chambre", type: "blind",  level: 0 }
];

const SCENES = [
  { id: "hello",  name: "Bienvenue", icon: "home",  set: { l1: { on: true, level: 70 }, th: { on: true, target: 20 }, b1: { level: 100 } } },
  { id: "cine",   name: "Cinéma",    icon: "film",  set: { l1: { on: true, level: 15 }, l3: { on: true, level: 20 }, b1: { level: 0 }, tv: { on: true } } },
  { id: "night",  name: "Bonne nuit",icon: "moon",  set: { l1: { on: false }, l2: { on: false }, l3: { on: false }, l4: { on: false }, b1: { level: 0 }, b2: { level: 0 }, tv: { on: false }, lk: { on: true }, th: { target: 17 } } },
  { id: "away",   name: "Départ",    icon: "exit",  set: { l1: { on: false }, l2: { on: false }, l3: { on: false }, l4: { on: false }, tv: { on: false }, lk: { on: true }, th: { target: 16 } } }
];

const APPS = [
  { name: "Plex",           icon: "play",    color: "linear-gradient(145deg,#f2b01e,#c57a0a)" },
  { name: "Jellyfin",       icon: "film",    color: "linear-gradient(145deg,#8d6cf0,#3b6fe0)" },
  { name: "Home Assistant", icon: "home",    color: "linear-gradient(145deg,#41bdf5,#1f7ac9)" },
  { name: "Parsec",         icon: "monitor", color: "linear-gradient(145deg,#ff6b6b,#c9263f)" },
  { name: "Bambu",          icon: "printer", color: "linear-gradient(145deg,#3ed67a,#139a52)" },
  { name: "Réglages",       icon: "sliders", color: "linear-gradient(145deg,#9aa3b5,#5b6478)" }
];

const printer = { job: "Support_ecran.3mf", progress: 63, paused: false, nozzle: 220, bed: 60, totalMin: 190 };
const media = { title: "Dune : Deuxième partie", sub: "Plex · Salon", pos: 41, playing: false };

/* ---------- Icônes ---------- */
const ICONS = {
  light: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  plug: '<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5"/>',
  thermo: '<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  blind: '<path d="M4 4h16M4 8h16M4 12h16M12 12v7M10 19h4"/>',
  lock: '<path d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/>',
  tv: '<path d="M3 5h18v12H3zM8 21h8M12 17v4"/>',
  home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  film: '<path d="M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/>',
  moon: '<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',
  exit: '<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor"/>',
  pause: '<path d="M8 5v14M16 5v14" stroke-width="3.2"/>',
  prev: '<path d="M7 5v14M19 5v14L9 12z" fill="currentColor"/>',
  next: '<path d="M17 5v14M5 5v14l10-7z" fill="currentColor"/>',
  monitor: '<path d="M3 4h18v12H3zM9 20h6M12 16v4"/>',
  printer: '<path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/>',
  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4 4 0 0 1 17 18H7z"/>',
  full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  sleep: '<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/><path d="M15 3h4l-4 4h4"/>'
};
const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const $ = (id) => document.getElementById(id);

/* ---------- Etat ---------- */
let room = "Tout";
let activeScene = null;
const byId = (id) => DEVICES.find((d) => d.id === id);
const isOn = (d) => d.type === "blind" ? d.level > 0 : !!d.on;

function stateText(d) {
  switch (d.type) {
    case "light": return d.on ? `${d.level} %` : "Éteinte";
    case "thermo": return d.on ? `Chauffe · ${String(d.target).replace(".", ",")}°` : `Arrêté · ${String(d.current).replace(".", ",")}°`;
    case "blind": return d.level > 0 ? `Ouverts · ${d.level} %` : "Fermés";
    case "lock": return d.on ? "Verrouillée" : "Déverrouillée";
    case "plug": return d.on ? "Allumée" : "Éteinte";
    case "tv": return d.on ? "Allumée" : "Éteinte";
  }
  return "";
}
const iconFor = (d) => d.type === "light" ? "light" : d.type === "plug" ? "plug" : d.type;

function toggle(d) {
  activeScene = null;
  if (d.type === "blind") d.level = d.level > 0 ? 0 : 100;
  else d.on = !d.on;
  renderAll();
}

/* ---------- Rendu ---------- */
function renderScenes() {
  $("scenes").innerHTML = SCENES.map((s) =>
    `<button class="scene glass${activeScene === s.id ? " active" : ""}" data-scene="${s.id}" aria-pressed="${activeScene === s.id}">${ic(s.icon)}${s.name}</button>`).join("");
}
function renderRooms() {
  $("rooms").innerHTML = ROOMS.map((r) =>
    `<button class="room" role="tab" data-room="${r}" aria-selected="${r === room}">${r}</button>`).join("");
}
function renderGrid() {
  const list = DEVICES.filter((d) => room === "Tout" || d.room === room);
  $("grid").innerHTML = list.map((d) => {
    const on = isOn(d);
    const cls = ["tile", "glass", on ? "on" : "", d.type === "lock" ? "lockd" : "", d.type === "thermo" ? "cool" : ""].join(" ");
    return `<button class="${cls}" data-id="${d.id}" aria-pressed="${on}">
      <span class="ico">${ic(iconFor(d))}</span>
      <span><span class="name">${d.name}</span><span class="state">${stateText(d)}</span></span></button>`;
  }).join("");
}
function renderStatus() {
  const lights = DEVICES.filter((d) => d.type === "light" && d.on).length;
  const lock = byId("lk");
  const parts = [lights === 0 ? "Aucune lumière allumée" : lights === 1 ? "1 lumière allumée" : `${lights} lumières allumées`, lock.on ? "Porte verrouillée" : "Porte déverrouillée"];
  $("status").textContent = parts.join(" · ");
}
function renderAll() { renderScenes(); renderGrid(); renderStatus(); }

function fmtDur(min) { const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`; }
function renderPrinter() {
  const p = printer;
  $("ring-fg").style.strokeDashoffset = 251.3 * (1 - p.progress / 100);
  $("ring").classList.toggle("paused", p.paused);
  $("ring-val").textContent = `${Math.round(p.progress)} %`;
  $("p-job").textContent = p.job;
  $("p-left").textContent = p.progress >= 100 ? "Terminé" : p.paused ? "En pause" : `Fin dans ${fmtDur((100 - p.progress) / 100 * p.totalMin)}`;
  $("p-temps").textContent = `Buse ${p.nozzle}° · Plateau ${p.bed}°`;
  $("p-toggle").textContent = p.paused ? "Reprendre" : "Pause";
}
function renderMedia() {
  $("m-title").textContent = media.title;
  $("m-sub").textContent = media.sub;
  $("m-bar").style.width = media.pos + "%";
  $("m-play").innerHTML = ic(media.playing ? "pause" : "play");
}

/* ---------- Horloge, salutation, thème ---------- */
const fmtTime = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" });
const fmtDate = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });
function tick() {
  const now = new Date(), h = now.getHours();
  const t = fmtTime.format(now), raw = fmtDate.format(now);
  const d = raw.charAt(0).toUpperCase() + raw.slice(1);
  $("clock").textContent = t;
  $("date").textContent = d;
  ambientTick(now, d);
  const g = h < 5 ? "Bonne nuit" : h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir";
  $("hello").textContent = `${g}, ${USER}`;
}

const THEMES = ["auto", "light", "dark"];
let theme = "auto";
try { theme = THEMES.includes(localStorage.getItem("prisme-theme")) ? localStorage.getItem("prisme-theme") : "auto"; } catch (e) {}
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = theme;
  $("btn-theme").innerHTML = ic(theme === "auto" ? "auto" : theme === "light" ? "sun" : "moon");
  $("btn-theme").setAttribute("aria-label", `Thème : ${theme === "auto" ? "automatique" : theme === "light" ? "clair" : "sombre"}`);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- Fiche de réglage ---------- */
let sheetDev = null;
function openSheet(d) {
  if (!["light", "thermo", "blind"].includes(d.type)) return;
  sheetDev = d;
  const r = $("sheet-range");
  $("sheet-name").textContent = d.name; $("sheet-room").textContent = d.room;
  if (d.type === "light") { r.min = 1; r.max = 100; r.step = 1; r.value = d.level; }
  if (d.type === "blind") { r.min = 0; r.max = 100; r.step = 5; r.value = d.level; }
  if (d.type === "thermo") { r.min = 10; r.max = 28; r.step = 0.5; r.value = d.target; }
  r.setAttribute("aria-label", d.type === "light" ? "Luminosité" : d.type === "blind" ? "Ouverture" : "Température cible");
  updateSheet();
  try { $("sheet").showModal(); } catch (e) { $("sheet").setAttribute("open", ""); }
}
function updateSheet() {
  const d = sheetDev; if (!d) return;
  $("sheet-val").textContent = d.type === "thermo" ? `${String(d.target).replace(".", ",")}°` : `${d.type === "light" ? d.level : d.level} %`;
  $("sheet-toggle").textContent = d.type === "thermo" ? (d.on ? "Arrêter" : "Chauffer") : d.type === "blind" ? (d.level > 0 ? "Fermer" : "Ouvrir") : (d.on ? "Éteindre" : "Allumer");
}
$("sheet-range").addEventListener("input", (e) => {
  const d = sheetDev, v = parseFloat(e.target.value); activeScene = null;
  if (d.type === "light") { d.level = v; d.on = true; }
  if (d.type === "blind") d.level = v;
  if (d.type === "thermo") { d.target = v; d.on = true; }
  updateSheet(); renderAll();
});
$("sheet-toggle").addEventListener("click", () => {
  const d = sheetDev; toggle(d);
  $("sheet-range").value = d.type === "thermo" ? d.target : d.level; updateSheet();
});
$("sheet-close").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").close(); });

/* ---------- Interactions ---------- */
let press = null, pressTimer = null;
const grid = $("grid");
grid.addEventListener("contextmenu", (e) => e.preventDefault());
grid.addEventListener("pointerdown", (e) => {
  const t = e.target.closest(".tile"); if (!t) return;
  press = { id: t.dataset.id, long: false };
  pressTimer = setTimeout(() => { if (press) { press.long = true; openSheet(byId(press.id)); } }, 450);
});
const endPress = (commit) => {
  clearTimeout(pressTimer);
  if (commit && press && !press.long) toggle(byId(press.id));
  press = null;
};
grid.addEventListener("pointerup", () => endPress(true));
grid.addEventListener("pointercancel", () => endPress(false));
grid.addEventListener("pointerleave", () => endPress(false));
grid.addEventListener("keydown", (e) => {
  const t = e.target.closest(".tile");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(byId(t.dataset.id)); }
});

$("scenes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-scene]"); if (!b) return;
  const s = SCENES.find((x) => x.id === b.dataset.scene);
  for (const [id, patch] of Object.entries(s.set)) Object.assign(byId(id), patch);
  activeScene = s.id; renderAll(); toast(`Scène « ${s.name} » activée`);
});
$("rooms").addEventListener("click", (e) => {
  const b = e.target.closest("[data-room]"); if (!b) return;
  room = b.dataset.room; renderRooms(); renderGrid();
});

$("p-toggle").addEventListener("click", () => { printer.paused = !printer.paused; renderPrinter(); toast(printer.paused ? "Impression en pause" : "Impression reprise"); });
$("m-play").addEventListener("click", () => { media.playing = !media.playing; renderMedia(); });
$("m-prev").addEventListener("click", () => { media.pos = 0; renderMedia(); });
$("m-next").addEventListener("click", () => { media.pos = Math.min(100, media.pos + 10); renderMedia(); });

$("dock").addEventListener("click", (e) => {
  const b = e.target.closest("[data-app]"); if (!b) return;
  toast(`Aperçu : « ${b.dataset.app} » s'ouvrira depuis la version Android`);
});
$("btn-theme").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("prisme-theme", theme); } catch (e) {}
  applyTheme();
});
$("btn-full").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => toast("Plein écran refusé par le navigateur"));
  } catch (e) { toast("Plein écran indisponible ici"); }
});

/* Veille */
let idleTimer;
function wake() { $("ambient").hidden = true; resetIdle(); }
function sleepNow() {
  $("ambient").hidden = false;
  if (ambStyle === "analog" && !ambRaf) analogLoop();
}
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(sleepNow, IDLE_MS); }
$("btn-sleep").addEventListener("click", (e) => { e.stopPropagation(); sleepNow(); });
$("ambient").addEventListener("pointerdown", wake);
document.addEventListener("pointerdown", () => { if ($("ambient").hidden) resetIdle(); });

/* Veille : horloge numérique ou analogique */
const AMB_STYLES = ["digital", "analog"];
let ambStyle = "digital", ambRaf = 0;
try { const v = localStorage.getItem("prisme-amb"); if (AMB_STYLES.includes(v)) ambStyle = v; } catch (e) {}
function buildAnalog() {
  const g = $("ticks");
  for (let i = 0; i < 60; i++) {
    const big = i % 5 === 0, a = i * 6 * Math.PI / 180, r1 = big ? 126 : 135, r2 = 146;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", (160 + Math.sin(a) * r1).toFixed(2)); l.setAttribute("y1", (160 - Math.cos(a) * r1).toFixed(2));
    l.setAttribute("x2", (160 + Math.sin(a) * r2).toFixed(2)); l.setAttribute("y2", (160 - Math.cos(a) * r2).toFixed(2));
    l.setAttribute("class", big ? "tick big" : "tick");
    g.appendChild(l);
  }
}
function applyAmbStyle() {
  $("ambient").dataset.style = ambStyle;
  $("amb-style").textContent = ambStyle === "digital" ? "Horloge analogique" : "Horloge numérique";
}
function ambientTick(now, dateText) {
  const h = now.getHours();
  $("ah").textContent = String(h).padStart(2, "0");
  $("am").textContent = String(now.getMinutes()).padStart(2, "0");
  $("a-date").textContent = dateText;
  const info = [`${WEATHER.temp}° ${WEATHER.label.toLowerCase()}`];
  if (printer.progress < 100 && !printer.paused) info.push(`Impression ${Math.round(printer.progress)} % · fin dans ${fmtDur((100 - printer.progress) / 100 * printer.totalMin)}`);
  $("a-info").textContent = info.join("  ·  ");
  $("ambient").classList.toggle("night", h >= 22 || h < 7);
}
function analogLoop() {
  if ($("ambient").hidden || ambStyle !== "analog") { ambRaf = 0; return; }
  const n = new Date(), s = n.getSeconds() + n.getMilliseconds() / 1000, m = n.getMinutes() + s / 60, h = (n.getHours() % 12) + m / 60;
  $("hand-s").style.transform = `rotate(${s * 6}deg)`;
  $("hand-m").style.transform = `rotate(${m * 6}deg)`;
  $("hand-h").style.transform = `rotate(${h * 30}deg)`;
  ambRaf = requestAnimationFrame(analogLoop);
}
$("amb-style").addEventListener("pointerdown", (e) => e.stopPropagation());
$("amb-style").addEventListener("click", () => {
  ambStyle = ambStyle === "digital" ? "analog" : "digital";
  try { localStorage.setItem("prisme-amb", ambStyle); } catch (e) {}
  applyAmbStyle();
  if (ambStyle === "analog" && !ambRaf) analogLoop();
});

/* ---------- Démarrage ---------- */
$("weather").innerHTML = `${ic("cloud")}${WEATHER.temp}° ${WEATHER.label}`;
$("btn-full").innerHTML = ic("full");
$("btn-sleep").innerHTML = ic("sleep");
$("printer-title").innerHTML = `${ic("printer")}Bambu Lab A1`;
$("media-title").innerHTML = `${ic("film")}Lecture`;
$("poster").innerHTML = ic("film");
$("m-prev").innerHTML = ic("prev"); $("m-next").innerHTML = ic("next");
$("dock").innerHTML = APPS.map((a) => `<button class="app-btn" data-app="${a.name}"><span class="app-ico" style="background:${a.color}">${ic(a.icon)}</span>${a.name}</button>`).join("");

buildAnalog(); applyAmbStyle(); applyTheme(); renderRooms(); renderAll(); renderPrinter(); renderMedia(); tick(); resetIdle();
setInterval(tick, 1000);
setInterval(() => {
  if (!printer.paused && printer.progress < 100) { printer.progress = Math.min(100, printer.progress + 0.5); renderPrinter(); }
  if (media.playing) { media.pos = Math.min(100, media.pos + 0.4); renderMedia(); }
}, 5000);
</script>
</body>
</html>
