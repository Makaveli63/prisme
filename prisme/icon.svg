<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset=".55" stop-color="#3a3fb8"/>
      <stop offset="1" stop-color="#7b4fe0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".1" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- incoming light -->
  <path d="M40 300 L222 262" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".95"/>
  <!-- rainbow -->
  <g opacity=".95" filter="url(#soft)">
    <path d="M300 250 L512 170 L512 205 Z" fill="#ff5a5f"/>
    <path d="M300 256 L512 205 L512 240 Z" fill="#ff9f43"/>
    <path d="M300 262 L512 240 L512 275 Z" fill="#ffd93d"/>
    <path d="M300 268 L512 275 L512 310 Z" fill="#4cd97b"/>
    <path d="M300 274 L512 310 L512 345 Z" fill="#3fa9ff"/>
    <path d="M300 280 L512 345 L512 380 Z" fill="#a66bff"/>
  </g>
  <!-- prism -->
  <path d="M256 112 L388 360 Q394 374 378 374 L134 374 Q118 374 124 360 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 140 L170 300" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".55"/>
</svg>
